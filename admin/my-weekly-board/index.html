<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>My Weekly Board | ATS Admin</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
/>

<link
  rel="stylesheet"
  href="/admin/admin-layout.css?v=6008"
/>

<link
  rel="icon"
  type="image/png"
  href="/assets/images/logo-v2.png"
/>

<script
  defer
  src="/admin/admin-nav.js?v=6008"
></script>

<script
  defer
  src="./my-weekly-board.js?v=6009"
></script>

<style>

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body.ats-admin{
  background:
    radial-gradient(
      circle at top left,
      rgba(138,92,255,.18),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #0c1020,
      #070b16
    );
}

.my-board-container{
  width:100%;
  max-width:1500px;
  margin:0 auto;
  padding:18px;
  box-sizing:border-box;
}

.my-board-shell{
  width:100%;
  overflow:hidden;
  padding:20px;
}

.my-board-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  flex-wrap:wrap;
}

.my-board-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap;
}

.my-board-meta{
  opacity:.78;
  margin-top:8px;
  line-height:1.45;
}

#statusBox{
  margin-top:14px;
  line-height:1.45;
  opacity:.9;
}

.view-toolbar{
  display:none;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.view-toolbar.open{
  display:flex;
}

.board-toggle-btn,
.my-clock-top-btn,
.my-clock-job-btn{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 16px;
  border-radius:999px;
  border:1px solid rgba(255,230,0,.44);
  background:rgba(255,230,0,.10);
  color:#ffe600;
  font-weight:950;
  text-decoration:none;
  cursor:pointer;
}

.board-toggle-btn.active,
.my-clock-top-btn,
.my-clock-job-btn{
  background:#ffe600;
  color:#10121f;
  border-color:#ffe600;
  box-shadow:0 0 22px rgba(255,230,0,.16);
}

.view-help{
  width:100%;
  color:rgba(255,255,255,.66);
  font-size:13px;
  line-height:1.4;
}

.my-board-week{
  display:grid;
  grid-template-columns:
    repeat(
      7,
      minmax(0,1fr)
    );

  gap:12px;
  margin-top:22px;
}

.my-day-card{
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.06),
      rgba(255,255,255,.03)
    );

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:20px;

  padding:14px;

  min-width:0;

  transition:
    transform .18s ease,
    border-color .18s ease;
}

.my-day-card:hover{
  transform:translateY(-2px);

  border-color:
    rgba(255,230,0,.25);
}

.my-day-card.past-day{
  opacity:.55;
  filter:grayscale(.55);
}

.my-day-title{
  font-size:18px;
  font-weight:900;
}

.my-day-date{
  margin-top:4px;
  margin-bottom:14px;

  font-size:12px;

  color:
    rgba(255,255,255,.68);
}

.my-job-card{
  background:
    rgba(0,0,0,.22);

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:16px;

  padding:14px;

  margin-bottom:12px;
}

.my-client-btn{
  appearance:none;
  border:0;
  background:transparent;

  color:#fff;

  padding:0;
  margin:0;

  font:inherit;
  font-size:18px;
  font-weight:900;

  text-align:left;

  cursor:pointer;

  text-decoration:underline;
  text-underline-offset:3px;
}

.my-client-btn:disabled{
  cursor:not-allowed;
  opacity:.65;
  text-decoration:none;
}

.my-job-address,
.my-job-notes,
.my-job-shared{
  margin-top:10px;

  font-size:13px;

  line-height:1.45;

  color:
    rgba(255,255,255,.82);

  overflow-wrap:anywhere;
}

.my-job-address a{
  color:#ffe600;
  font-weight:900;
}

.my-clock-job-btn{
  width:100%;
  margin-top:12px;
  border-radius:14px;
}

.my-job-date-lock{
  margin-top:12px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:34px;

  padding:
    8px 12px;

  border-radius:999px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.12);

  font-size:12px;
  font-weight:900;

  color:
    rgba(255,255,255,.72);
}

.full-week-job{
  display:grid;
  gap:6px;
}

.full-week-employee{
  color:#ffe600;
  font-size:13px;
  font-weight:950;
}

.full-week-client{
  color:#fff;
  font-size:16px;
  font-weight:950;
}

.empty-day{
  opacity:.58;
  font-size:13px;
}

.spec-card{
  display:none;

  margin-top:20px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.06),
      rgba(255,255,255,.03)
    );

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:20px;

  padding:20px;
}

.spec-card.open{
  display:block;
}

.spec-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;

  margin-bottom:14px;
}

.spec-line{
  margin-bottom:18px;
}

.spec-label{
  font-size:12px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.06em;

  opacity:.68;

  margin-bottom:5px;
}

.spec-value{
  white-space:pre-wrap;
  line-height:1.55;
}

@media(max-width:1200px){

  .my-board-week{
    grid-template-columns:
      repeat(
        3,
        minmax(0,1fr)
      );
  }

}

@media(max-width:850px){

  .my-board-week{
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

}

@media(max-width:760px){

  .my-board-container{
    padding:12px;
  }

  .my-board-shell{
    padding:16px;
  }

  .my-board-week{
    grid-template-columns:1fr;
  }

  .my-board-actions{
    width:100%;
    justify-content:stretch;
  }

  .my-clock-top-btn,
  .board-toggle-btn{
    flex:1 1 auto;
  }

}

</style>
</head>

<body class="ats-admin">

<header class="ats-header">

  <div class="ats-header-inner">

    <a
      class="ats-brand"
      href="/admin/"
    >
      <img
        src="/assets/images/logo-v2.png"
        alt="About To Shine Cleaning"
      />
    </a>

    <div class="ats-header-actions">

      <a
        class="ats-live-btn"
        href="https://abouttoshinecleaning.com"
        target="_blank"
      >
        Go to Live Website
      </a>

      <button
        class="ats-burger"
        type="button"
        aria-label="Open menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </div>

</header>

<main class="ats-main">

  <div class="my-board-container">

    <section class="ats-card my-board-shell">

      <div class="my-board-top">

        <div>

          <div class="ats-eyebrow">
            Employee Weekly Board
          </div>

          <h1 id="pageTitle">
            My Weekly Board
          </h1>

          <h2 id="weekLabel" style="margin:.35rem 0 0;">
            Loading week...
          </h2>

          <div
            class="my-board-meta"
            id="statusBox"
          >
            Loading assignments...
          </div>

        </div>

        <div class="my-board-actions">
          <a
            class="my-clock-top-btn"
            id="clockLink"
            href="/admin/clock/"
          >
            Open Clock
          </a>
        </div>

      </div>

      <div
        class="view-toolbar"
        id="viewToolbar"
      >
        <button
          class="board-toggle-btn active"
          type="button"
          id="btnMyJobs"
          aria-pressed="true"
        >
          My Jobs
        </button>

        <button
          class="board-toggle-btn"
          type="button"
          id="btnFullWeek"
          aria-pressed="false"
        >
          Full Week
        </button>

        <div
          class="view-help"
          id="viewHelp"
        >
          My Jobs shows maps, specs, and clock-in for active service days.
        </div>
      </div>

      <div
        class="my-board-week"
        id="weekBoard"
      ></div>

    </section>

    <section
      class="spec-card"
      id="clientSpecsCard"
    >

      <div class="spec-head">

        <h2
          id="specTitle"
          style="margin:0;"
        >
          Client Specs
        </h2>

        <button
          class="button button-secondary"
          type="button"
          id="closeSpecsBtn"
        >
          Close
        </button>

      </div>

      <div id="clientSpecsBody">
        Loading...
      </div>

    </section>

  </div>

</main>

</body>
</html>
