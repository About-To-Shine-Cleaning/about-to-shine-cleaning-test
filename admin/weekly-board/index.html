<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Weekly Assignment Board | ATS Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="/admin/admin-layout.css"/>
<link rel="stylesheet" href="/assets/css/style.css"/>

<script defer src="/admin/admin-nav.js"></script>
<script defer src="./weekly-board.js?v=3"></script>

<style>
/* =========================================================
   ATS WEEKLY BOARD EDITOR — MOBILE / MODAL CONTROL FIX
   Patch target: /admin/weekly-board/index.html
   Purpose: keep modal controls visible and make job list scroll inside modal
   ========================================================= */

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden !important;
}

body.ats-admin{
  min-height:100dvh;
  background-attachment:scroll !important;
  background-repeat:no-repeat !important;
  background-size:cover !important;
}

body.ats-admin .ats-main{
  width:100% !important;
  max-width:100% !important;
  overflow-x:hidden !important;
}

body.ats-admin .ats-container{
  max-width:none !important;
  width:96vw !important;
  margin:0 auto !important;
  padding-left:24px !important;
  padding-right:24px !important;
  overflow-x:hidden !important;
}

body.ats-admin .ats-card{
  max-width:none !important;
  width:100% !important;
  overflow:hidden !important;
}

.week-board{
  display:grid !important;
  grid-template-columns:repeat(7, minmax(170px, 1fr)) !important;
  gap:14px !important;
  margin-top:24px !important;
  width:100% !important;
  max-width:100% !important;
  overflow:visible !important;
}

.day-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  min-height:260px;
  min-width:0 !important;
  max-width:100% !important;
  padding:14px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.day-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  flex:0 0 auto;
}

.day-name{
  font-size:15px;
  font-weight:800;
}

.day-date{
  font-size:12px;
  opacity:.7;
}

.assignment{
  background:rgba(0,0,0,.14);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
  max-width:100%;
  overflow-wrap:anywhere;
}

.assignment strong{
  display:block;
  margin-bottom:4px;
}

.assignment button{
  margin-top:8px;
}

.assignment-client{
  line-height:1.35;
  overflow-wrap:anywhere;
}

.add-assignment{
  margin-top:auto;
}

.modal-backdrop{
  position:fixed !important;
  inset:0 !important;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center !important;
  justify-content:center !important;
  z-index:9999;
  overflow:hidden !important;
  padding:12px !important;
}

.modal-backdrop.open{
  display:flex !important;
}

.modal{
  width:min(900px, 96vw) !important;
  max-width:96vw !important;
  max-height:92dvh !important;
  background:#232857;
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:24px;
  overflow:hidden !important;
  display:flex !important;
  flex-direction:column !important;
  min-height:0 !important;
}

/* Keep the title/close controls visible */
.modal > div:first-child{
  flex:0 0 auto !important;
  margin-bottom:14px !important;
}

.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  flex:0 0 auto !important;
}

.modal input,
.modal select,
.modal button{
  max-width:100% !important;
}

.modal input,
.modal select{
  width:100%;
}

#clientSuggestions{
  max-height:180px;
  overflow-y:auto;
  overflow-x:hidden;
  margin-top:8px;
}

/* Keep Add Assignment controls from being pushed out by jobs */
#btnAddAssignment{
  flex:0 0 auto !important;
}

.modal-grid + div{
  flex:0 0 auto !important;
  margin-top:14px !important;
}

.assignment-list{
  flex:1 1 auto !important;
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  padding-right:8px !important;
  margin-top:18px !important;
  overscroll-behavior:contain;
}

@media(max-width:1300px){
  .week-board{
    grid-template-columns:repeat(3, minmax(220px, 1fr)) !important;
  }
}

@media(max-width:800px){
  body.ats-admin .ats-container{
    width:100% !important;
    padding-left:14px !important;
    padding-right:14px !important;
  }

  .week-board{
    grid-template-columns:1fr !important;
  }
}

@media(max-width:760px){
  body.ats-admin .ats-container{
    padding-left:10px !important;
    padding-right:10px !important;
  }

  .modal-backdrop.open{
    align-items:stretch !important;
    justify-content:center !important;
    padding:10px !important;
  }

  .modal{
    width:100% !important;
    max-width:100% !important;
    max-height:calc(100dvh - 20px) !important;
    border-radius:18px !important;
    padding:16px !important;
  }

  .modal > div:first-child{
    gap:12px !important;
    align-items:flex-start !important;
  }

  .modal-grid{
    grid-template-columns:1fr !important;
  }

  .assignment{
    width:100% !important;
    max-width:100% !important;
  }

  .assignment .button,
  .modal .button{
    width:100% !important;
    min-width:0 !important;
  }

  .assignment-list{
    padding-right:4px !important;
  }
@media(max-width:760px){
  body.ats-admin{
    background-attachment:scroll !important;
    background-size:cover !important;
    background-position:center top !important;
  }

  .ats-main{
    background:transparent !important;
  }
}
</style>
</head>

<body class="ats-admin">

<header class="ats-header">
  <div class="ats-header-inner">

    <a class="ats-brand" href="/admin/">
      <img src="/assets/images/logo-v2.png" alt="">
    </a>

    <div class="ats-header-actions">
      <button class="ats-burger" type="button">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</header>

<main class="ats-main">
<div class="ats-container">

<section class="ats-card">

<div style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;">
  <div>
    <div class="ats-eyebrow">Weekly Assignment Board</div>
    <h1 id="weekLabel">Loading week...</h1>
  </div>

  <button class="button" id="btnSaveWeek">
    Save Weekly Board
  </button>
</div>

<div class="week-board" id="weekBoard"></div>

</section>

</div>
</main>

<div class="modal-backdrop" id="assignmentModal">

<div class="modal">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
    <h2 id="modalTitle">Assignments</h2>

    <button class="button button-secondary" id="closeModal">
      Close
    </button>
  </div>

  <div class="modal-grid">

    <div>
      <label>Employee</label>
      <select id="employeeSelect"></select>
    </div>

    <div>
      <label>Client</label>
      <input type="text" id="clientSearch" placeholder="Start typing client name...">
      <div id="clientSuggestions"></div>
    </div>

  </div>

  <div style="margin-top:18px;">
    <button class="button" id="btnAddAssignment">
      Add Assignment
    </button>
  </div>

  <div class="assignment-list" id="assignmentList"></div>

</div>
</div>

</body>
</html>
