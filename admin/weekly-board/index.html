<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Weekly Assignment Board | ATS Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>

<link rel="stylesheet" href="/admin/admin-layout.css"/>
<link rel="stylesheet" href="/assets/css/style.css"/>
<link rel="icon" type="image/png" href="/assets/images/logo-v2.png"/>
<link rel="apple-touch-icon" href="/assets/images/logo-v2.png"/>

<script defer src="/admin/admin-nav.js?v=8"></script>
<script defer src="/admin/weekly-board/weekly-board.js?v=2000"></script>

<style>
html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden !important;
}

body.ats-admin{
  min-height:100dvh;
  background-attachment:scroll !important;
  background-repeat:no-repeat !important;
  background-size:cover !important;
  background-position:center top !important;
}

body.ats-admin .ats-main{
  width:100% !important;
  max-width:none !important;
  overflow-x:hidden !important;
  background:transparent !important;
}

body.ats-admin .weekly-editor-container{
  width:100vw !important;
  max-width:none !important;
  margin:0 !important;
  padding-left:18px !important;
  padding-right:18px !important;
  box-sizing:border-box !important;
}

body.ats-admin .ats-card{
  max-width:none !important;
  width:100% !important;
  overflow:hidden !important;
  background:rgba(255,255,255,.04) !important;
  backdrop-filter:blur(10px);
}

.week-board{
  display:grid !important;
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
  gap:12px !important;
  margin-top:24px !important;
  width:100% !important;
  max-width:100% !important;
}

.day-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  min-height:260px;
  min-width:0 !important;
  max-width:100% !important;
  padding:12px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.day-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  flex:0 0 auto;
}

.day-name{
  font-size:15px;
  font-weight:800;
}

.day-date{
  font-size:12px;
  opacity:.7;
}

.assignment{
  background:rgba(0,0,0,.14);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
  max-width:100%;
  overflow-wrap:anywhere;
}

.assignment strong{
  display:block;
  margin-bottom:4px;
}

.assignment-client{
  line-height:1.35;
  overflow-wrap:anywhere;
}

.assignment button{
  margin-top:8px;
}

.modal-backdrop{
  position:fixed !important;
  inset:0 !important;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center !important;
  justify-content:center !important;
  z-index:9999;
  overflow:hidden !important;
  padding:12px !important;
}

.modal-backdrop.open{
  display:flex !important;
}

.modal{
  width:min(900px,96vw) !important;
  max-width:96vw !important;
  max-height:92dvh !important;
  background:#232857;
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:24px;
  overflow:hidden !important;
  display:flex !important;
  flex-direction:column !important;
  min-height:0 !important;
}

.modal > div:first-child{
  flex:0 0 auto !important;
  margin-bottom:14px !important;
}

.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  flex:0 0 auto !important;
}

.modal input,
.modal select,
.modal button{
  max-width:100% !important;
}

.modal input,
.modal select{
  width:100%;
}

#clientSuggestions{
  max-height:180px;
  overflow-y:auto;
  overflow-x:hidden;
  margin-top:8px;
}

#btnAddAssignment{
  flex:0 0 auto !important;
}

.modal-grid + div{
  flex:0 0 auto !important;
  margin-top:14px !important;
}

.assignment-list{
  flex:1 1 auto !important;
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  padding-right:8px !important;
  margin-top:18px !important;
  overscroll-behavior:contain;
}

@media(max-width:1200px){
  .week-board{
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  }
}

@media(max-width:800px){
  body.ats-admin .weekly-editor-container{
    width:100% !important;
    padding-left:12px !important;
    padding-right:12px !important;
  }

  .week-board{
    grid-template-columns:1fr !important;
  }

  .day-card{
    min-height:0;
  }
}

@media(max-width:760px){
  .modal-backdrop.open{
    align-items:stretch !important;
    justify-content:center !important;
    padding:10px !important;
  }

  .modal{
    width:100% !important;
    max-width:100% !important;
    max-height:calc(100dvh - 20px) !important;
    border-radius:18px !important;
    padding:16px !important;
  }

  .modal-grid{
    grid-template-columns:1fr !important;
  }

  .assignment .button,
  .modal .button{
    width:100% !important;
    min-width:0 !important;
  }
}
</style>

<style id="ats-unified-page-finish">
/* Page-level finish: keeps layout CSS, forces ATS operational colors/buttons. */
.ats-card,
.day-card,
.my-day-card,
.my-job-card,
.assignment,
.client-result,
.spec-box,
.spec-card,
.modal{
  background:linear-gradient(180deg, rgba(22,26,40,.96), rgba(13,16,25,.96)) !important;
  border:1px solid rgba(255,255,255,.13) !important;
  color:#f7f7fb !important;
  box-shadow:0 18px 50px rgba(0,0,0,.35) !important;
}
.button,
a.button,
button.button,
#btnSaveWeek,
#btnAddAssignment,
.map-btn{
  background:#000 !important;
  color:#ffe600 !important;
  border:1px solid rgba(255,230,0,.55) !important;
  border-radius:10px !important;
  font-weight:900 !important;
  box-shadow:0 10px 24px rgba(0,0,0,.35) !important;
}
.button:hover,
a.button:hover,
button.button:hover,
#btnSaveWeek:hover,
#btnAddAssignment:hover,
.map-btn:hover{
  background:#111 !important;
  color:#ffe600 !important;
  border-color:rgba(255,230,0,.85) !important;
  text-decoration:none !important;
}
.button-secondary,
button.button-secondary{
  background:rgba(0,0,0,.34) !important;
  color:#f7f7fb !important;
  border:1px solid rgba(255,255,255,.18) !important;
}
input,
select,
textarea,
.client-search{
  background:rgba(0,0,0,.35) !important;
  color:#f7f7fb !important;
  border:1px solid rgba(255,255,255,.18) !important;
}
.my-day-card.past-day{
  opacity:.48 !important;
  filter:grayscale(.75) !important;
}
.my-day-card.past-day button,
.my-day-card.past-day a{
  pointer-events:none !important;
  cursor:not-allowed !important;
}
</style>

</head>

<body class="ats-admin">
<header class="ats-header">
  <div class="ats-header-inner">
    <a class="ats-brand" href="/admin/" aria-label="Go to Home">
      <img src="/assets/images/logo-v2.png" alt="About To Shine Cleaning Logo" />
    </a>
    <div class="ats-header-actions">
      <a class="ats-live-btn" href="https://abouttoshinecleaning.com" target="_blank" rel="noopener">Go to Live Website</a>
      <button class="ats-burger" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="atsNavDrawer" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main class="ats-main">
  <div class="weekly-editor-container">
    <section class="ats-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;">
        <div>
          <div class="ats-eyebrow">Weekly Assignment Board</div>
          <h1 id="weekLabel">Loading week...</h1>
        </div>
        <button class="button" id="btnSaveWeek">Refresh Board</button>
      </div>

      <div class="week-board" id="weekBoard"></div>
    </section>
  </div>
</main>

<div class="modal-backdrop" id="assignmentModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;">
      <h2 id="modalTitle">Assignments</h2>
      <button class="button button-secondary" id="closeModal">Close</button>
    </div>

    <div class="modal-grid">
      <div>
        <label>Employee</label>
        <select id="employeeSelect"></select>
      </div>

      <div>
        <label>Client</label>
        <input type="text" id="clientSearch" placeholder="Start typing client name...">
        <div id="clientSuggestions"></div>
      </div>
    </div>

    <div>
      <button class="button" id="btnAddAssignment">Add Assignment</button>
    </div>

    <div class="assignment-list" id="assignmentList"></div>
  </div>
</div>

</body>
</html>
