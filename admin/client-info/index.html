<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Client Info | ATS Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="/admin/admin-layout.css"/>
<link rel="stylesheet" href="/assets/css/style.css"/>

<script defer src="/admin/admin-nav.js"></script>
<script defer src="./client-info.js?v=1"></script>

<style>
.client-search-wrap{
  margin-top:18px;
}

.client-search{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.18);
  color:#fff;
  font-size:18px;
}

.client-results{
  margin-top:16px;
  display:grid;
  gap:12px;
}

.client-result{
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);
  border-radius:18px;
  padding:14px;
  cursor:pointer;
}

.client-result:hover{
  background:rgba(255,255,255,.11);
}

.client-card{
  margin-top:20px;
  display:none;
}

.client-card.open{
  display:block;
}

.client-header{
  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.client-name{
  font-size:28px;
  font-weight:900;
}

.client-address{
  opacity:.85;
  margin-top:4px;
}

.spec-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.spec-box{
  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.14);
  border-radius:18px;
  padding:16px;
}

.spec-label{
  color:#FFD700;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:8px;
}

.spec-value{
  white-space:pre-wrap;
  line-height:1.45;
}

.map-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:999px;
  background:rgba(255,215,0,.18);
  border:1px solid rgba(255,215,0,.55);
  color:#fff;
  font-weight:800;
  text-decoration:none;
}

@media(max-width:760px){
  .spec-grid{
    grid-template-columns:1fr;
  }

  .client-name{
    font-size:24px;
  }
}
</style>
</head>

<body class="ats-admin">

<header class="ats-header">
  <div class="ats-header-inner">

    <a class="ats-brand" href="/admin/">
      <img src="/assets/images/logo-v2.png" alt="">
    </a>

    <div class="ats-header-actions">
      <button class="ats-burger" type="button">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</header>

<main class="ats-main">
<div class="ats-container">

<section class="ats-card">

  <div>
    <div class="ats-eyebrow">Client Information</div>
    <h1>Client Specs</h1>
    <p class="ats-subtitle">
      Search a client to view address, entry info, cleaning notes, and special instructions.
    </p>
  </div>

  <div class="client-search-wrap">
    <input
      id="clientSearch"
      class="client-search"
      type="text"
      placeholder="Start typing client name..."
      autocomplete="off"
    />

    <div id="clientResults" class="client-results"></div>
  </div>

</section>

<section class="ats-card client-card" id="clientCard">

  <div class="client-header">
    <div>
      <div class="client-name" id="clientName">—</div>
      <div class="client-address" id="clientAddress">—</div>
    </div>

    <a id="mapLink" class="map-btn" href="#" target="_blank" rel="noopener">
      Open Map
    </a>
  </div>

  <div class="spec-grid">

    <div class="spec-box">
      <div class="spec-label">Frequency</div>
      <div class="spec-value" id="clientFrequency">—</div>
    </div>

    <div class="spec-box">
      <div class="spec-label">Payout</div>
      <div class="spec-value" id="clientPayout">—</div>
    </div>

    <div class="spec-box">
      <div class="spec-label">Specs</div>
      <div class="spec-value" id="clientSpecs">—</div>
    </div>

    <div class="spec-box">
      <div class="spec-label">Special Info</div>
      <div class="spec-value" id="clientSpecialInfo">—</div>
    </div>

  </div>

</section>

</div>
</main>

</body>
</html>
