<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Employee Clock In | About To Shine Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>

<link rel="stylesheet" href="/assets/css/style.css"/>
<link rel="stylesheet" href="/admin/admin-layout.css"/>
<link rel="icon" type="image/png" href="/assets/images/logo-v2.png"/>
<link rel="apple-touch-icon" href="/assets/images/logo-v2.png"/>
<script defer src="/admin/admin-nav.js?v=8"></script>

<style>
.clock-client-specs{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(0,0,0,.12);
  background:#f8fafc;
}
</style>
</head>

<body class="ats-admin ats-clock">
<header class="ats-header">
  <div class="ats-header-inner">
    <a class="ats-brand" href="/admin/" aria-label="Go to Home">
      <img src="/assets/images/logo-v2.png" alt="About To Shine Cleaning Logo"/>
    </a>

    <div class="ats-header-actions">
      <a class="ats-live-btn" href="https://abouttoshinecleaning.com" target="_blank" rel="noopener">
        Go to Live Website
      </a>
      <button class="ats-burger" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="atsNavDrawer" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main class="ats-main">
  <div class="ats-container">
    <section class="ats-card ats-card--light">
      <h2>Employee Time Clock</h2>
      <p id="employee-display"></p>

      <div id="clock-status" role="status" aria-live="polite" style="margin:12px 0;"></div>

      <section id="todayJobsCard" style="display:none;">
        <h3 style="margin-top:0;">Today’s Jobs</h3>
        <div id="todayJobsList">Loading today’s jobs...</div>
      </section>

      <div>
        <label for="jobSearch">Current Cleaning</label>

        <input
          type="text"
          id="jobSearch"
          placeholder="Start typing client name..."
          autocomplete="off"
          style="width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid #ccc;"
        />

        <div id="jobResults" style="margin-top:10px;"></div>

        <select id="jobSelect" style="display:none;">
          <option value="">-- Select Current Cleaning --</option>
        </select>

        <div id="jobAddressLink" style="margin-top:10px;"></div>

        <section id="clientSpecsCard" class="clock-client-specs">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
            <h3 style="margin:0;">Client Specs</h3>
            <button class="button" id="btnToggleClientSpecs" type="button" style="padding:8px 12px;">
              Hide
            </button>
          </div>

          <div id="clientSpecsBody" style="margin-top:12px;">
            Loading client info...
          </div>
        </section>

        <button class="button" id="btnClockIn" onclick="clockIn()" style="margin-top:12px;">
          Clock In
        </button>
      </div>

      <div class="clock-actions" style="margin-top:16px;">
        <button class="button" id="btnBreakStart" onclick="startBreak()">Start Break</button>
        <button class="button" id="btnBreakEnd" onclick="endBreak()">End Break</button>
        <button class="button" id="btnClockOut" onclick="clockOut()">Clock Out</button>
      </div>

      <section style="margin-top:22px;">
        <label for="jobNotes"><strong>Job Notes (optional)</strong></label>
        <textarea id="jobNotes" rows="4" style="width:100%;max-width:860px;"></textarea>
        <p style="margin-top:8px;font-size:0.95rem;opacity:0.8;">
          Notes will be saved when you Clock Out.
        </p>
      </section>

      <hr style="margin:40px 0;"/>

      <section>
        <h3>Management Contact</h3>
        <div class="clock-actions">
          <a class="button" href="tel:16108445928">Call Shannon</a>
          <a class="button" href="tel:13477292829">Call Matt</a>
        </div>
      </section>
    </section>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-callout">
          Sit back, relax — your home is about to shine!
        </div>
        <div class="footer-bottom">
          © 2026 About To Shine Cleaning • Emmaus, PA
        </div>
      </div>
    </footer>
  </div>
</main>

<script defer src="/assets/js/clock.js?v=203"></script>
</body>
</html>
